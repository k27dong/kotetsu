name: Pi program

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y build-essential pkgconf git ca-certificates
          libpango1.0-dev libcairo2-dev libcjson-dev libcurl4-openssl-dev libgpiod-dev
          libnl-genl-3-dev curl unzip tzdata
      - name: Check out
        uses: actions/checkout@v4
      - name: Download fonts
        run: |
          set -eu
          mkdir -p pi/fonts
          curl -fsSL -o pi/fonts/LXGWWenKaiGBScreen.ttf https://github.com/lxgw/LxgwWenKai-Screen/releases/download/v1.530/LXGWWenKaiGBScreen.ttf
          curl -fsSL -o Inter-4.1.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          echo "9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e  Inter-4.1.zip" | sha256sum -c
          unzip -p Inter-4.1.zip extras/ttf/Inter-SemiBold.ttf > pi/fonts/Inter-SemiBold.ttf
          echo "0df4009ac9dce6eb3b8cb4c4e90de67bb9745e8992a255c03a58dd5fe3f1e503  pi/fonts/LXGWWenKaiGBScreen.ttf" | sha256sum -c
          echo "78a843fade9d4612a5567302fb595b56976eb5fcebf4fea5a5912d638bafcde3  pi/fonts/Inter-SemiBold.ttf" | sha256sum -c
      - name: Create a user without root rights
        run: useradd --create-home ci && chown -R ci .
      - name: Build
        run: su ci -c 'make -C pi -j4'
      - name: Test
        run: su ci -c 'make -C pi test'
